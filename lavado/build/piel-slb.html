<style id="piel-slb">
/* Piel SLB v1 (linea visual comun, 06/11/2026). Cinta grafito con logo, franja de area y pie con logo. */
:root{--slb-grafito:#3f454c;--slb-area:#2b6d84;--slb-logo-pie:#646b72}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--slb-grafito:#2a3035;--slb-logo-pie:#a2a9ae}}
:root[data-theme="dark"]{--slb-grafito:#2a3035;--slb-logo-pie:#a2a9ae}
.slb-flota{--slb-area:#2b6d84}.slb-prod{--slb-area:#7a6a3a}.slb-planta{--slb-area:#4b6b4a}.slb-adm{--slb-area:#5a5f8a}.slb-calidad{--slb-area:#8a4f5d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .slb-flota{--slb-area:#6fb3c9} :root:not([data-theme="light"]) .slb-prod{--slb-area:#c9b27a} :root:not([data-theme="light"]) .slb-planta{--slb-area:#8fbf8d} :root:not([data-theme="light"]) .slb-adm{--slb-area:#a3a8d8} :root:not([data-theme="light"]) .slb-calidad{--slb-area:#d39aa8}}
:root[data-theme="dark"] .slb-flota{--slb-area:#6fb3c9} :root[data-theme="dark"] .slb-prod{--slb-area:#c9b27a} :root[data-theme="dark"] .slb-planta{--slb-area:#8fbf8d} :root[data-theme="dark"] .slb-adm{--slb-area:#a3a8d8} :root[data-theme="dark"] .slb-calidad{--slb-area:#d39aa8}
.slb-cinta{background:var(--slb-grafito);color:#eef1f2;border-bottom:4px solid var(--slb-area)}
.slb-cinta-in{max-width:var(--slb-ancho,1180px);margin:0 auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.slb-logo{display:block;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-position:left center;mask-position:left center}
